{# Escena de la portada: documento PDF con el símbolo de huella de la plataforma y un haz que lo escanea.
   Representa lo que hace la plataforma: cada copia lleva la identidad del comprador. #}
<div class="escena" aria-hidden="true">
  <svg class="escena-svg" viewBox="0 0 420 440" focusable="false">
    <defs>
      <linearGradient id="haz-grad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#B9E5EF" stop-opacity="0"/>
        <stop offset=".85" stop-color="#B9E5EF" stop-opacity=".28"/>
        <stop offset="1" stop-color="#B9E5EF" stop-opacity=".9"/>
      </linearGradient>
      <clipPath id="recorte-doc"><rect x="80" y="44" width="260" height="360" rx="16"/></clipPath>
    </defs>
    <g class="documento-pdf">
      <rect class="doc-sombra" x="92" y="56" width="260" height="360" rx="16"/>
      <path class="doc-hoja" d="M96,44 H300 L340,84 V388 A16,16 0 0 1 324,404 H96 A16,16 0 0 1 80,388 V60 A16,16 0 0 1 96,44 Z"/>
      <path class="doc-pliegue" d="M300,44 V72 A12,12 0 0 0 312,84 H340"/>
      <rect class="doc-linea" x="104" y="72" width="150" height="5" rx="2.5"/><rect class="doc-linea" x="104" y="86" width="190" height="5" rx="2.5"/>
      <g class="huella simbolo">
        <rect class="cresta c0" pathLength="1" x="93" y="115" width="234" height="234" rx="68"/>
        <path class="cresta c1" pathLength="1" d="M158 273.6 V232 A52 52 0 0 1 262 232 V263.2"/>
        <path class="cresta c2" pathLength="1" d="M184 284 V232 A26 26 0 0 1 236 232 V252.8"/>
        <circle class="pulso" cx="210" cy="289.2" r="13"/>
        <circle class="pulso retraso" cx="210" cy="289.2" r="13"/>
        <circle class="punto" cx="210" cy="289.2" r="13"/>
      </g>
      <rect class="doc-linea" x="104" y="366" width="212" height="4" rx="2"/><rect class="doc-linea" x="104" y="378" width="170" height="4" rx="2"/>
      <g clip-path="url(#recorte-doc)">
        <rect class="haz" x="80" y="0" width="260" height="70" fill="url(#haz-grad)"/>
      </g>
    </g>
  </svg>
  <span class="ficha ficha-a"><b>SHA-256</b> íntegro</span>
  <span class="ficha ficha-b"><b>Firma</b> RSA-PSS válida</span>
  <span class="ficha ficha-c"><code>SCD1-7b60-U3-O1</code></span>
</div>
