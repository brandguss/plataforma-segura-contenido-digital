{% extends "base.html" %}
{% block titulo %}Iniciar sesión{% endblock %}
{% block contenido %}
<form class="credencial" method="post">
  <h1>Iniciar sesión</h1>
  <p class="entrada">Entra para ver tus órdenes y descargar tus copias.</p>
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label>Correo electrónico <input type="email" name="email" maxlength="254" required autocomplete="username"></label>
  <label>Contraseña <input type="password" name="password" maxlength="128" required autocomplete="current-password"></label>
  <button class="boton">Iniciar sesión</button>
  <div class="pie-formulario">
    <p><a href="{{ url_for('publico.recuperar') }}">Olvidé mi contraseña</a></p>
    <p>¿No tienes cuenta? <a href="{{ url_for('publico.registro') }}">Crear cuenta</a></p>
  </div>
</form>
{% endblock %}
