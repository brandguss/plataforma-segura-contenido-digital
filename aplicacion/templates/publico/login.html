{% extends "base.html" %}
{% block titulo %}Iniciar sesión{% endblock %}
{% block contenido %}
<form class="tarjeta formulario" method="post">
  <h1>Iniciar sesión</h1>
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label>Correo <input type="email" name="email" maxlength="254" required autocomplete="username"></label>
  <label>Contraseña <input type="password" name="password" maxlength="128" required autocomplete="current-password"></label>
  <button class="boton">Entrar</button>
  <p><a href="{{ url_for('publico.recuperar') }}">¿Olvidaste tu contraseña?</a></p>
</form>
{% endblock %}
