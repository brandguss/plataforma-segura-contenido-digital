{% extends "base.html" %}
{% block titulo %}Órdenes{% endblock %}
{% block contenido %}
<h1>Órdenes</h1>
<table>
  <tr><th>#</th><th>Cliente</th><th>Fecha</th><th>Total</th><th>Estado</th><th></th></tr>
  {% for o in ordenes %}
  <tr>
    <td>{{ o.id }}</td><td>{{ o.email }}</td><td>{{ o.created_at }}</td><td>{{ o.total|moneda }}</td>
    <td><span class="estado {{ o.status|lower }}">{{ o.status }}</span></td>
    <td><a href="{{ url_for('operador.orden', orden_id=o.id) }}">Procesar</a></td>
  </tr>
  {% else %}
  <tr><td colspan="6">No hay órdenes.</td></tr>
  {% endfor %}
</table>
{% endblock %}
